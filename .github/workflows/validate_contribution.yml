name: Validate Community Contribution

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'pending_candidates.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-contribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pyyaml

      - name: Run validation script
        id: validation
        run: |
          python .github/scripts/validate_contribution.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash

      - name: Comment validation result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ steps.validation.outputs.result }}';
            const message = '${{ steps.validation.outputs.message }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Validation Result\n\n**Status:** ${result}\n\n${message}`
            });

      - name: Auto-merge if validation passed
        if: steps.validation.outputs.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash'
            });

      - name: Close PR if validation failed
        if: steps.validation.outputs.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });